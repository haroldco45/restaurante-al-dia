name: Robot de noticias

on:
  schedule:
    - cron: '*/30 * * * *'   # cada 30 minutos
  workflow_dispatch:          # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: robot-noticias
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Buscar noticias reales
        run: node scripts/robot-noticias.mjs

      - name: Guardar si hay noticias nuevas
        run: |
          if git diff --quiet data/noticias.json; then
            echo "Nada nuevo."
          else
            git config user.name "robot-noticias"
            git config user.email "robot-noticias@users.noreply.github.com"
            git add data/noticias.json
            git commit -m "Noticias $(TZ=America/Bogota date '+%Y-%m-%d %H:%M') (hora Colombia)"
            git push
          fi
